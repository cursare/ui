name: Sync learner registry

on:
  workflow_dispatch:
  repository_dispatch:
    types: [learner-registry-updated]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ui
      - uses: actions/checkout@v4
        with:
          repository: cursare/cursare
          ref: main
          path: cursare
          token: ${{ secrets.CURSARE_SOURCE_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run registry:sync ../cursare
          bun run check
      - working-directory: ui
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md registry.json registry/learner public/r
          git commit -m "chore: sync learner registry"
          git push
