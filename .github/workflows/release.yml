name: Release package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Publish @cursare/ui
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Report skipped npm publication
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "NPM_TOKEN is not configured; registry release remains available through GitHub."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
